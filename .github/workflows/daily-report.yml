name: Daily report

on:
  schedule:
    - cron: "17 5 * * *"     # every day 05:17 UTC - full update (all sources)
    - cron: "41 11 * * *"    # 11:41 UTC - quick refresh: new bookmaker prices, results
    - cron: "47 16 * * *"    # 16:47 UTC - quick refresh before evening/weekend games
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FOTMOB_XMAS: ${{ secrets.FOTMOB_XMAS }}
      # spread the slow per-match FotMob fetches over several days; finished matches stay cached
      FOTMOB_MAX_MATCHES: "70"          # current season, per competition per run
      FOTMOB_MAX_MATCHES_PREV: "25"     # last season (back-fills more slowly)
      FOOTY_TIME_BUDGET: "6000"         # 100 min: skip remaining slow fetches so the job always finishes
      PYTHONUNBUFFERED: "1"
      UNDERSTAT_MAX_MATCHES: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # keep the database + HTTP cache between runs
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: footy-data-${{ github.run_id }}
          restore-keys: footy-data-

      - name: Update data
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "17 5 * * *" ]; then
            echo "Quick refresh (football-data prices/results + FPL injury flags)"
            python -m footy update --sources football_data --no-players
          else
            python -m footy update
          fi
        continue-on-error: true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: footy-data-${{ github.run_id }}

      # latest LFC ticket state from the "LFC ticket alerts" workflow (tab + calendar feed)
      - uses: actions/cache/restore@v4
        with:
          path: data/tickets
          key: lfc-tickets-none
          restore-keys: lfc-tickets-

      - name: Build report
        run: |
          python -m footy status || true
          python -m footy report --out site/index.html
          mkdir -p site/download && cp data/footy.db site/download/footy.db || true
          python -m footy tickets ics --out site/lfc-tickets.ics || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
