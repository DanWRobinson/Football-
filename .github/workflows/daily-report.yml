name: Daily report

on:
  schedule:
    - cron: "17 5 * * *"     # every day 05:17 UTC
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOTMOB_XMAS: ${{ secrets.FOTMOB_XMAS }}
      # spread the slow per-match FotMob fetches over several days; finished matches stay cached
      FOTMOB_MAX_MATCHES: "80"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # keep the database + HTTP cache between runs
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: footy-data-${{ github.run_id }}
          restore-keys: footy-data-

      - name: Update data
        run: python -m footy update
        continue-on-error: true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: footy-data-${{ github.run_id }}

      - name: Build report
        run: |
          python -m footy status || true
          python -m footy report --out site/index.html
          mkdir -p site/download && cp data/footy.db site/download/footy.db || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
