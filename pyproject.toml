[project]
name = "footy"
version = "0.1.0"
description = "Data-led football analysis for fantasy football and betting: xG ratings, match probabilities, value bets, FPL expected points."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "requests>=2.31", "pyyaml>=6.0",
                "streamlit>=1.36", "plotly>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
footy = "footy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["footy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
