# Your personal settings for the phone page.

# Pinned on the Team and Fixtures tabs.
favourite_team: Liverpool

fpl:
  # Optional: your FPL team ID (the number in the address bar on the FPL website:
  # fantasy.premierleague.com/entry/<ID>/event/...). When set, the squad, bank and captain
  # are read from FPL automatically after every deadline and the list below is ignored.
  entry_id:
  bank: 0.0            # money in the bank (£m) - used for transfer suggestions
  # Gameweek 10 squad (from your screenshot). Name as shown in FPL + next opponent, so
  # players with the same surname can't be mixed up.
  squad:
    - {name: Suzuki, next: MUN (A)}
    - {name: Van Hecke, next: LEE (A)}
    - {name: Gabriel, next: HUL (H)}
    - {name: Rúben, next: NFO (A)}
    - {name: Neto, next: SUN (A)}
    - {name: Mbeumo, next: AVL (H)}
    - {name: Wirtz, next: CRY (A)}
    - {name: Rogers, next: SUN (A)}
    - {name: Isak, next: CRY (A)}
    - {name: Evanilson, next: IPS (A), vice: true}
    - {name: N.Jackson, next: MUN (A), captain: true}
    - {name: Jaouen, next: FUL (A), bench: 1}
    - {name: Gibbs-White, next: MCI (H), bench: 2}
    - {name: Hall, next: FUL (A), bench: 3}
    - {name: N.Williams, next: MCI (H), bench: 4}
